# ==========================================
# RESOURCEHUB - APPLICATION.PROPERTIES
# ==========================================

# ---------------------------------------------------------
# OPTION A: H2 IN-MEMORY DATABASE (ACTIVE)
# Recommended for Hackathon Local Development.
# Bypasses all Wi-Fi firewalls and port blocking.
# ---------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:resourcehub
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=FuKpxwVtZwlKFBohEAfbPwtlIbtYkiVU

# Hibernate Dialect & Auto-table creation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enables the web console to view your DB at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


